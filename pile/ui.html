<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pile</title>
<style>
:root{
  --bg:#0d0e11; --panel:#15171c; --raise:#1c1f26; --line:#262a33;
  --text:#e8e9ec; --dim:#9096a1; --faint:#5d636e;
  --accent:#ffb547; --accent-ink:#1a1206; --ok:#6fd49a;
  --fyi:#8fa6c8; --noise:#555b66;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
kbd{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--raise);border:1px solid var(--line);
  border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--text)}
.wrap{max-width:880px;margin:0 auto;padding:22px 20px 90px}
header{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:19px;letter-spacing:-.02em}
.logo svg{display:block}
.count{color:var(--dim);font-size:13px}
.count b{color:var(--text)}
.spacer{flex:1}
.pill{padding:5px 10px;border-radius:999px;color:var(--dim);border:1px solid transparent;font-size:13px;white-space:nowrap}
.pill:hover{color:var(--text)}
.pill.on{color:var(--text);background:var(--raise);border-color:var(--line)}
.pill .n{color:var(--faint);margin-left:5px;font-variant-numeric:tabular-nums}
.pill.on .n{color:var(--accent)}
.bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sep{width:1px;height:18px;background:var(--line);margin:0 6px}
#filter{display:none;width:100%;margin:0 0 12px;padding:10px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;color:var(--text);font:inherit;outline:none}
#filter:focus{border-color:var(--accent)}
.list{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:36px 1fr auto;gap:12px;padding:12px 16px 12px 14px;border-top:1px solid var(--line);
  border-left:3px solid transparent;cursor:pointer;position:relative}
.row:first-child{border-top:0}
.row:hover{background:rgba(255,255,255,.025)}
.row.sel{}
/* One cursor and one tint per selected run, drawn under the rows and gliding between them. */
.list{position:relative}
.row{z-index:1}
#hl{position:absolute;left:0;right:0;top:0;height:0;background:var(--raise);box-shadow:inset 3px 0 0 var(--accent);
  z-index:0;pointer-events:none;transition:top .1s ease,height .1s ease}
.pickblock{position:absolute;left:5px;right:5px;background:rgba(255,181,71,.10);border-radius:10px;z-index:0;
  pointer-events:none;transition:top .1s ease,height .1s ease}
body.private #hl{background:#2b303b;box-shadow:inset 4px 0 0 var(--accent)}
body.private .pickblock{background:rgba(255,181,71,.2)}
@media (prefers-reduced-motion:reduce){#hl,.pickblock{transition:none}}
.followbadge{position:fixed;left:12px;bottom:12px;z-index:9;font-size:12px;font-weight:600;color:var(--accent-ink);
  background:var(--accent);border-radius:8px;padding:4px 9px}
.acts{position:absolute;right:10px;top:8px;display:none;gap:4px;background:var(--raise);padding:3px;border-radius:9px;border:1px solid var(--line);z-index:1}
.row:hover .acts,.row.sel .acts{display:flex}
.acts button{font-size:12px;padding:3px 8px;border-radius:6px;color:var(--dim)}
.acts button:hover{background:var(--bg);color:var(--text)}
@media (hover:hover){.row.sel:not(:hover) .acts{display:none}}
.row.picked{}
.row.picked .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
/* Screen-share mode blurs the avatar (and its ring) and the text, so the cursor and the selection carry their own marks. */
#picked b{color:var(--accent)}
.av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;color:#0d0e11}
.main{min-width:0}
.l1{display:flex;align-items:baseline;gap:7px;min-width:0}
.who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app{color:var(--faint);font-size:12px;white-space:nowrap}
.l2{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.l2 .t{color:var(--text)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.when{color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.more{font-size:11px;color:var(--dim);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.chip{font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;white-space:nowrap}
.chip.needs-you{background:var(--accent);color:var(--accent-ink)}
.chip.fyi{background:rgba(143,166,200,.15);color:var(--fyi)}
.chip.tag.task{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.tag{background:rgba(255,181,71,.12);color:var(--accent);border:1px solid rgba(255,181,71,.35)}
.row:not(.open) .l2.older{display:none}
.l2.older{font-size:13px;margin-top:3px;padding-left:10px;border-left:2px solid var(--line)}
.chip.noise{background:rgba(85,91,102,.18);color:var(--noise)}
.learned{font-size:11px;color:var(--ok)}
.row.noiserow .who,.row.noiserow .l2{opacity:.55}
.ask{grid-column:2/4;display:flex;gap:10px;align-items:center;color:var(--dim);font-size:13px;
  background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 10px;margin-top:2px}
.ask button{padding:2px 9px;border-radius:6px;background:var(--raise);border:1px solid var(--line)}
.ask button:hover{border-color:var(--accent)}
.zero{text-align:center;padding:90px 20px 100px;color:var(--dim)}
.zero .big{font-size:34px;font-weight:700;color:var(--text);letter-spacing:-.03em;margin:16px 0 6px}
.keys{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:26px 16px 14px}
.keys div{max-width:880px;margin:0 auto;display:flex;gap:14px;flex-wrap:wrap;color:var(--faint);font-size:12px;justify-content:center}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:8px 14px;border-radius:10px;font-weight:500;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.pop{position:fixed;inset:0;background:rgba(5,6,8,.6);display:none;align-items:flex-start;justify-content:center;padding-top:16vh;z-index:5}
.pop.show{display:flex}
.card{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:0 0 12px;color:var(--dim);font-size:13px}
.card input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);font:inherit;outline:none}
.card input:focus{border-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{display:flex;justify-content:space-between;text-align:left;padding:9px 12px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.opts button:hover,.opts button.hl{border-color:var(--accent)}
.opts button.hl{background:var(--raise)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100vw);background:var(--panel);border-left:1px solid var(--line);
  transform:translateX(100%);transition:transform .2s;z-index:6;padding:20px;overflow:auto}
.drawer.show{transform:none}
.drawer h3{margin:0 0 4px}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.rule .k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);padding-top:2px}
.rule .v{font:12px ui-monospace,Menlo,monospace;color:var(--dim);word-break:break-all;margin-top:2px}
.rule button{color:var(--faint);font-size:16px;padding:0 4px}
.rule button:hover{color:#ff7a7a}
/* Screen-share mode (p): blur who and what, keep the shape of the inbox. */
body.private .who,body.private .l2,body.private .av,body.private .card code,body.private .card b,body.private #fixurl,
body.private .rule .v,body.private .rule b,body.private .learned{filter:blur(9px)}
body.private.keep-github .row.src-github .who,body.private.keep-github .row.src-github .av{filter:none}
.privbadge{display:none;font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:2px 7px}
body.private .privbadge{display:inline-block}
@media (max-width:560px){.keys{display:none}.app{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><rect x="3" y="14" width="18" height="6" rx="2" fill="#ffb547"/><rect x="5" y="8" width="14" height="5" rx="2" fill="#ffb547" opacity=".65"/><rect x="7" y="3" width="10" height="4" rx="2" fill="#ffb547" opacity=".35"/></svg>
      pile
    </div>
    <div class="count" id="count"></div>
    <span class="count" id="picked"></span>
    <span class="privbadge" title="Screen-share mode: names and messages are blurred (p)">private</span>
    <div class="spacer"></div>
    <button class="pill" id="undoBtn" title="Undo (z); Shift+Z redoes">Undo</button>
    <button class="pill" id="learnedBtn" title="What pile has learned (?)">Learned <span class="n" id="nrules">0</span></button>
    <button class="pill" id="refreshBtn" title="Collect now (r)">Refresh</button>
  </header>
  <div class="bar" id="views"></div>
  <div class="bar" id="sources"></div>
  <input id="filter" placeholder="Filter: person, app, words…  (Esc to clear)" autocomplete="off">
  <div id="list"></div>
</div>
<div class="keys"><div>
  <span><kbd>j</kbd><kbd>k</kbd> move</span><span><kbd>⇧</kbd>+<kbd>j</kbd><kbd>k</kbd> <kbd>x</kbd> select</span><span><kbd>o</kbd> open</span><span><kbd>e</kbd> done</span>
  <span><kbd>s</kbd> snooze</span><span><kbd>+</kbd><kbd>-</kbd> important / not</span><span><kbd>f</kbd> fix link</span>
  <span><kbd>c</kbd> combine</span><span><kbd>m</kbd> mute app</span><span><kbd>/</kbd> filter</span>
  <span><kbd>z</kbd> undo <kbd>Z</kbd> redo</span><span><kbd>?</kbd> learned</span><span><kbd>p</kbd> screen-share</span>
</div></div>
<div class="toast" id="toast"></div>
<div class="pop" id="pop"><div class="card" id="popcard"></div></div>
<div class="drawer" id="drawer"></div>
<script>
"use strict";
const $ = s => document.querySelector(s);
const S = {follow: new URLSearchParams(location.search).has("follow"), expanded: null, toggled: new Set(), anchor: null, items: [], stats: {}, view: "new", source: "", filter: "", sel: 0, asked: null, undo: null, rules: []};
const SOURCES = {macos: "Notifications", windows: "Notifications", linux: "Notifications", github: "GitHub", imap: "Mail",
  mailapp: "Apple Mail", messages: "Messages", webhook: "Webhook", demo: "Demo"};
function srcLabel(k){
  if (SOURCES[k]) return SOURCES[k];
  const it = S.items.find(x => x.source === k);  // e.g. "Gmail · work" for an IMAP account
  return it ? it.app_name : k.replace(/^imap:/, "Mail · ");
}
const VIEWS = [["new", "Inbox"], ["unanswered", "Unanswered"], ["sift", "Sift"], ["snoozed", "Snoozed"], ["done", "Done"]];

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
const APPCOLOR = {Slack: "#d9a6f2", Messages: "#7ee08a", GitHub: "#cfd6de", Discord: "#8f9cff", Linear: "#f29ac0",
  Gmail: "#ff8f7e", Mail: "#7ec8ff", Calendar: "#7ec8ff", Teams: "#9aa5ff", WhatsApp: "#6fdc8c", Telegram: "#6cc4f5"};
function color(name){ return APPCOLOR[name] || `hsl(${hue(name)} 70% 70%)`; }
function hue(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 360; }
function ago(t){
  const d = Date.now() / 1000 - t;
  if (d < 60) return "now";
  if (d < 3600) return Math.floor(d / 60) + "m";
  if (d < 86400) return Math.floor(d / 3600) + "h";
  return Math.floor(d / 86400) + "d";
}
function toast(msg){ lastToast = {id: TAB + ++toastSeq, text: msg}; showToast(msg); publish(); }
function showToast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); }
async function api(path, body){
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}

// One row per thread (a person, a channel, a PR): newest item leads, the rest count.
function groups(){
  const f = S.filter.toLowerCase();
  const map = new Map();
  let items = S.items;
  if (S.view === "unanswered") items = items.filter(x => x.tag === "unanswered").sort((a, b) => a.at - b.at);  // oldest first
  // Sift: newsletters, receipts and other robots wait here until the real inbox is done.
  else if (S.view === "sift") items = items.filter(x => x.tag === "sift").sort((a, b) => a.at - b.at);
  else if (S.view === "new") items = items.filter(x => x.tag !== "sift");
  for (const it of items) {
    if (f && ![it.sender, it.title, it.body, it.app_name].join(" ").toLowerCase().includes(f)) continue;
    const g = map.get(it.thread);
    if (g) g.items.push(it); else map.set(it.thread, {lead: it, items: [it]});
  }
  return [...map.values()];
}

// Refreshes keep the cursor on the same thread and never undo what the screen already shows.
let loadSeq = 0;
async function load(){
  const seq = ++loadSeq;
  const q = new URLSearchParams({state: ["unanswered", "sift"].includes(S.view) ? "new" : S.view});
  if (S.source) q.set("source", S.source);
  const j = await api("/api/items?" + q);
  if (seq !== loadSeq || S.pending) return;  // a newer load, or an action still on its way to the server
  const before = current(), key = before && before.lead.thread;
  S.items = j.items; S.stats = j.stats;
  if (key) { const i = groups().findIndex(g => g.lead.thread === key); if (i >= 0) S.sel = i; }
  render();
}
// Optimistic changes: show the result now, tell the server in the background, put it back if that fails.
S.pending = 0;
function optimistic(change, call, ok){
  const snap = {items: S.items, stats: S.stats, sel: S.sel};
  change();
  render();
  S.pending++;
  call().then(r => { S.pending--; if (ok) ok(r); if (!S.pending) { load(); loadRules(); } })
    .catch(err => { S.pending--; S.items = snap.items; S.stats = snap.stats; S.sel = snap.sel; render(); toast("Didn't save: " + err.message); });
}
function dropItems(ids){
  const gone = new Set(ids);
  const n = S.items.filter(x => gone.has(x.id)).length;
  S.items = S.items.filter(x => !gone.has(x.id));
  S.stats = Object.assign({}, S.stats, {new: Math.max(0, (S.stats.new || 0) - (["new", "unanswered", "sift"].includes(S.view) ? n : 0))});
}
async function loadRules(){ S.rules = (await api("/api/rules")).rules; $("#nrules").textContent = S.rules.length; }

function render(){
  const st = S.stats;
  const inboxN = st.new - (st.sift || 0);
  $("#count").innerHTML = inboxN ? `<b>${inboxN}</b> new` + (st.labels && st.labels["needs-you"] ? ` · <b style="color:var(--accent)">${st.labels["needs-you"]}</b> need you` : "") : "all clear";
  $("#views").innerHTML = VIEWS.filter(([k]) => !["unanswered", "sift"].includes(k) || st[k]).map(([k, n]) => `<button class="pill ${S.view === k ? "on" : ""}" data-view="${k}">${n}<span class="n">${k === "new" ? st.new - (st.sift || 0) : (st[k] || 0)}</span></button>`).join("");
  const srcs = Object.entries(st.sources || {});
  const total = srcs.reduce((a, [, n]) => a + n, 0);
  $("#sources").innerHTML = !["new", "unanswered", "sift"].includes(S.view) ? "" :
    `<button class="pill ${!S.source ? "on" : ""}" data-src="">All<span class="n">${total}</span></button>` +
    srcs.map(([k, n], i) => `<button class="pill ${S.source === k ? "on" : ""}" data-src="${esc(k)}" title="${i + 1}">${esc(srcLabel(k))}<span class="n">${n}</span></button>`).join("");
  const gs = groups();
  S.sel = Math.max(0, Math.min(S.sel, gs.length - 1));
  const live = new Set(gs.map(g => g.lead.thread));
  for (const t of [...S.toggled]) if (!live.has(t)) S.toggled.delete(t);
  if (S.anchor !== null && !live.has(S.anchor)) S.anchor = null;
  const P = pickedSet(gs);  // the one source of truth for highlight and actions
  $("#picked").innerHTML = P.size ? `<b>${P.size}</b> selected · <kbd>Esc</kbd> to clear` : "";
  if (!gs.length) {
    const wake = st.next_wake ? new Date(st.next_wake * 1000).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"}) : "";
    $("#list").innerHTML = S.view === "new" && !S.filter ? `<div class="zero">
      <svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="#ffb547" stroke-width="3" opacity=".35"/><path d="M20 33l8 8 16-17" stroke="#ffb547" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="big">Inbox zero.</div><div>Nothing needs you right now.${st.snoozed ? ` ${st.snoozed} snoozed${wake ? ", next back " + esc(wake) : ""}.` : ""}</div>
      ${st.sift ? `<button class="pill on" data-view="sift" style="margin-top:18px">Sift ${st.sift} unread${st.sift > 1 ? "s" : ""}: newsletters, receipts, updates</button>` : ""}</div>`
      : `<div class="zero">Nothing here.</div>`;
    return;
  }
  $("#list").innerHTML = `<div class="list">` + gs.map((g, i) => {
    const it = g.lead, name = it.sender || it.app_name;
    const ask = S.asked === it.id ? `<div class="ask">Did that land in the right place? <button data-act="yes"><kbd>y</kbd> Yes</button><button data-act="no"><kbd>n</kbd> No, fix it</button></div>` : "";
    return `<div class="row src-${esc(it.source)} ${i === S.sel ? "sel" : ""} ${P.has(it.thread) ? "picked" : ""} ${it.label === "noise" ? "noiserow" : ""}" data-i="${i}">
      <div class="av" style="background:${color(it.app_name)}">${esc(it.app_name[0] || "?")}</div>
      <div class="main"><div class="l1"><span class="who">${esc(name)}</span><span class="app">${esc(it.app_name)}</span>
        ${it.label ? `<span class="chip ${esc(it.label)}">${esc(it.label)}</span>` : ""}
        ${it.tag && it.tag !== "sift" ? `<span class="chip tag ${esc(it.tag)}">${esc(it.tag)}</span>` : ""}
        ${it.link_learned ? `<span class="learned" title="${esc(it.link)}">● learned link</span>` : ""}</div>
        <div class="l2">${it.title ? `<span class="t">${esc(it.title)}</span> — ` : ""}${esc(it.body)}</div>
        ${g.items.length > 1 ? g.items.slice(1, 5).map(x => `<div class="l2 older"><span class="t">${esc(x.sender || x.app_name)}</span> ${esc(x.body)} <span class="when">${ago(x.at)}</span></div>`).join("") + (g.items.length > 5 ? `<div class="l2 older">+${g.items.length - 5} more</div>` : "") : ""}</div>
      <div class="acts">
        <button data-a="open" title="Open (o)">Open</button><button data-a="done" title="${S.view === "done" ? "Back to inbox (e)" : "Done (e)"}">${S.view === "done" ? "Undone" : "Done"}</button>
        <button data-a="snooze" title="Snooze (s)">Snooze</button><button data-a="imp" title="Always important (+)">+</button>
        <button data-a="noise" title="Not important (-)">−</button><button data-a="fix" title="Fix where it opens (f)">Fix link</button>
        <button data-a="pick" title="Select (x)">${P.has(it.thread) ? "Unselect" : "Select"}</button><button data-a="combine" title="Combine selected (c)">Combine</button>
        <button data-a="mute" title="Mute app (m)">Mute</button></div>
      <div class="side"><span class="when">${ago(it.at)}</span>${g.items.length > 1 ? `<span class="more">${g.items.length}</span>` : ""}</div>
      ${ask}</div>`;
  }).join("") + `</div>`;
  decorate();
}

// Moving the cursor or the selection only flips classes on rows already on screen: no rebuild, so key repeat stays smooth.
let paintQueued = false;
function paint(){
  if (paintQueued) return;
  paintQueued = true;
  requestAnimationFrame(() => { paintQueued = false; decorate(); });
}
// Classes, the gliding cursor and the selection tint, on the rows already on screen.
function decorate(){
  const list = document.querySelector("#list .list");
  const rows = list ? [...list.querySelectorAll(".row")] : [];
  const gs = groups();
  if (rows.length !== gs.length) { render(); return; }
  S.sel = Math.max(0, Math.min(S.sel, gs.length - 1));
  const P = pickedSet(gs);
  rows.forEach((el, i) => {
    el.classList.toggle("sel", i === S.sel);
    el.classList.toggle("open", gs[i].lead.thread === S.expanded);
    const on = P.has(gs[i].lead.thread);
    if (el.classList.contains("picked") !== on) {
      el.classList.toggle("picked", on);
      const b = el.querySelector('[data-a="pick"]'); if (b) b.textContent = on ? "Unselect" : "Select";
    }
    const ask = el.querySelector(".ask"); if (ask && S.asked !== gs[i].lead.id) ask.remove();
  });
  $("#picked").innerHTML = P.size ? `<b>${P.size}</b> selected · <kbd>Esc</kbd> to clear` : "";
  if (list) {
    let hl = list.querySelector("#hl");
    if (!hl) { hl = document.createElement("div"); hl.id = "hl"; list.prepend(hl); }
    const r = rows[S.sel];
    if (r) { hl.style.top = r.offsetTop + "px"; hl.style.height = r.offsetHeight + "px"; }
    const runs = [];
    rows.forEach((el, i) => {
      if (!P.has(gs[i].lead.thread)) return;
      const last = runs[runs.length - 1];
      if (last && last.end === i - 1) { last.end = i; last.bottom = el.offsetTop + el.offsetHeight; }
      else runs.push({end: i, top: el.offsetTop, bottom: el.offsetTop + el.offsetHeight});
    });
    const blocks = [...list.querySelectorAll(".pickblock")];
    runs.forEach((run, k) => {
      let b = blocks[k];
      if (!b) { b = document.createElement("div"); b.className = "pickblock"; list.prepend(b); }
      b.style.top = (run.top + 3) + "px"; b.style.height = (run.bottom - run.top - 6) + "px";
    });
    blocks.slice(runs.length).forEach(b => b.remove());
    if (r && !S.follow) r.scrollIntoView({block: "nearest"});
  }
  publish();
}

// ---- Follow mode: a second tab (?follow, add &private to blur) mirrors this one live, for screen sharing. ----
const TAB = Math.random().toString(36).slice(2);
let pubTimer = null, toastSeq = 0, lastToast = null;
function publish(){
  if (S.follow) return;
  clearTimeout(pubTimer);
  pubTimer = setTimeout(() => {
    const g = groups()[S.sel], row = document.querySelectorAll("#list .row")[S.sel];
    const pop = $("#pop").classList.contains("show");
    const opts = [...document.querySelectorAll("#popcard .opts button")];
    const state = {tab: TAB, view: S.view, source: S.source, filter: S.filter, sel: g ? g.lead.thread : null,
      visible: groups().map(x => x.lead.thread), stats: S.stats,  // so followers drop cleared rows before the server confirms
      toggled: [...S.toggled], anchor: S.anchor, asked: S.asked, expanded: S.expanded,
      modal: pop ? {html: $("#popcard").innerHTML, hl: opts.findIndex(b => b.classList.contains("hl")),
                    input: ($("#popcard input") || {}).value || ""} : null,
      drawer: $("#drawer").classList.contains("show"), toast: lastToast,
      offset: row ? row.getBoundingClientRect().top : null, scrollY: window.scrollY};
    fetch("/api/presence", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(state)}).catch(() => {});
  }, 50);
}
async function followLoop(){
  let since = 0, version = -1;
  const badge = document.createElement("div");
  badge.className = "followbadge"; badge.textContent = "Following · Esc to detach";
  document.body.appendChild(badge);
  while (S.follow) {
    try {
      const r = await (await fetch("/api/presence?since=" + since + "&wait=15")).json();
      since = r.seq;
      const st = r.state;
      if (!st || !S.follow) continue;
      let fresh = r.version !== version || st.view !== S.view || st.source !== S.source;
      version = r.version;
      S.view = st.view; S.source = st.source; S.filter = st.filter || "";
      if (fresh) {
        const q = new URLSearchParams({state: ["unanswered", "sift"].includes(S.view) ? "new" : S.view});
        if (S.source) q.set("source", S.source);
        const j = await api("/api/items?" + q);
        S.items = j.items; S.stats = j.stats;
      }
      if (st.stats && !fresh) S.stats = st.stats;
      if (st.visible) {
        const vis = new Set(st.visible), before = S.items.length;
        S.items = S.items.filter(x => vis.has(x.thread));
        if (S.items.length !== before) fresh = true;
      }
      S.toggled = new Set(st.toggled || []); S.anchor = st.anchor; S.asked = st.asked; S.expanded = st.expanded;
      const i = groups().findIndex(g => g.lead.thread === st.sel); if (i >= 0) S.sel = i;
      filter.style.display = S.filter ? "block" : "none"; filter.value = S.filter;
      if (fresh || document.querySelectorAll("#list .row").length !== groups().length) render(); else decorate();
      if (st.modal) {
        if ($("#popcard").innerHTML !== st.modal.html) $("#popcard").innerHTML = st.modal.html;
        $("#pop").classList.add("show");
        const inp = $("#popcard input"); if (inp) inp.value = st.modal.input;
      } else $("#pop").classList.remove("show");
      const open = $("#drawer").classList.contains("show");
      if (st.drawer !== open) drawer(st.drawer);
      if (st.toast && (!lastToast || st.toast.id !== lastToast.id)) { lastToast = st.toast; showToast(st.toast.text); }
      const row = document.querySelectorAll("#list .row")[S.sel];
      if (row && st.offset !== null) window.scrollBy(0, row.getBoundingClientRect().top - st.offset);
      else if (st.scrollY !== undefined) window.scrollTo(0, st.scrollY);
    } catch (e) { await new Promise(r => setTimeout(r, 1000)); }
  }
  badge.remove();
}
window.addEventListener("scroll", () => publish(), {passive: true});
document.addEventListener("click", e => { if (S.follow) { e.stopPropagation(); e.preventDefault(); } }, true);

function current(){ return groups()[S.sel]; }
// The selected rows, or just the current one. Every batch is one history entry, so one undo.
function targets(){
  const gs = groups();
  const P = pickedSet(gs);
  const picked = gs.filter(g => P.has(g.lead.thread));
  return picked.length ? picked : (gs[S.sel] ? [gs[S.sel]] : []);
}
// Selection = rows toggled with x / Cmd-click, plus the live shift range from the anchor to the cursor
// (like vim's visual mode: moving back toward the anchor shrinks it, passing it flips direction).
function pickedSet(gs){
  gs = gs || groups();
  const set = new Set(S.toggled);
  if (S.anchor !== null) {
    const a = gs.findIndex(g => g.lead.thread === S.anchor);
    if (a >= 0) for (let i = Math.min(a, S.sel); i <= Math.max(a, S.sel); i++) if (gs[i]) set.add(gs[i].lead.thread);
  }
  return set;
}
function commitRange(){ for (const t of pickedSet()) S.toggled.add(t); S.anchor = null; }
function pick(i){ commitRange(); const g = groups()[i]; if (!g) return; const t = g.lead.thread; S.toggled.has(t) ? S.toggled.delete(t) : S.toggled.add(t); }
function extend(step, n){ if (S.anchor === null && groups()[S.sel]) S.anchor = groups()[S.sel].lead.thread; S.sel = Math.max(0, Math.min(n - 1, S.sel + step)); }
function clearPicks(){ S.toggled.clear(); S.anchor = null; }
async function act(kind, until){
  const gs = targets(); if (!gs.length) return;
  const ids = gs.flatMap(g => g.items.map(x => x.id));
  // The rows go away, so the cursor lands on whatever followed the first of them, not on the old index.
  const keys = groups().map(g => g.lead.thread), at = gs.map(g => keys.indexOf(g.lead.thread)).filter(i => i >= 0);
  if (at.length) S.sel = Math.min(...at);
  clearPicks();
  const inbox = ["new", "unanswered", "sift"].includes(S.view);
  if (kind === "done") {
    optimistic(() => dropItems(ids), () => api(inbox ? "/api/done" : "/api/reopen", {ids}));
    toast(inbox ? "Done" + (ids.length > 1 ? ` (${ids.length})` : "") : "Back in the inbox");
  }
  if (kind === "snooze") optimistic(() => dropItems(ids), () => api("/api/snooze", {ids, until}),
    r => toast("Snoozed until " + new Date(r.until).toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"})));
}
// Web links open right here, inside the keypress or click (a window.open after an await is a blocked popup).
// Everything else (sms:, slack://, an app) goes to the server, which runs macOS `open`.
async function openSel(){
  const g = current(); if (!g) return;
  const it = g.lead;
  const web = /^https?:\/\//.test(it.link);
  if (web) window.open(it.link, "_blank", "noopener");
  S.asked = it.id; render();
  try {
    const r = await api("/api/open", {id: it.id, browser_opened: web});
    toast((r.learned ? "Opened (learned link)" : "Opened") + (/couldn't|would/.test(r.result) ? ": " + r.result : ""));
  } catch (err) { toast("Couldn't open: " + err.message); }
}

function modal(html, onkey){ $("#popcard").innerHTML = html; $("#pop").classList.add("show"); modal.onkey = onkey; const inp = $("#popcard input"); if (inp) inp.focus();
  const first = $("#popcard .opts button"); if (first && !inp) first.classList.add("hl");
  if (inp) inp.addEventListener("input", publish);
  publish(); }
function closeModal(){ $("#pop").classList.remove("show"); modal.onkey = null; publish(); }
$("#pop").addEventListener("click", e => { if (e.target.id === "pop") closeModal(); });

function snoozeMenu(){
  modal(`<h3>Snooze until…</h3><p>Comes back to the inbox then.</p><div class="opts">
    <button data-u="1h"><span>An hour</span><kbd>h</kbd></button>
    ${new Date().getHours() < 18
      ? `<button data-u="tonight"><span>Tonight, 6pm</span><kbd>n</kbd></button>`
      : `<button data-u="3h"><span>In 3 hours</span><kbd>n</kbd></button>`}
    <button data-u="tomorrow"><span>Tomorrow, 9am</span><kbd>t</kbd></button>
    <button data-u="7d"><span>Next week</span><kbd>w</kbd></button></div>`,
    k => { const u = {h: "1h", n: new Date().getHours() < 18 ? "tonight" : "3h", t: "tomorrow", w: "7d"}[k]; if (u) { closeModal(); act("snooze", u); return true; } });
  $("#popcard").onclick = e => { const b = e.target.closest("[data-u]"); if (b) { closeModal(); act("snooze", b.dataset.u); } };
}
function fixLink(){
  const g = current(); if (!g) return;
  const it = g.lead;
  modal(`<h3>Where did you end up?</h3><p>Paste the link you landed on for <b>${esc(it.sender || it.title)}</b> in ${esc(it.app_name)} (a URL, an app link like slack://…, or a bundle id). pile will use it from now on.</p>
    <input id="fixurl" placeholder="https://…" value=""><p style="margin:10px 0 0">Opened: <code style="color:var(--faint)">${esc(it.link)}</code></p>`,
    null);
  $("#fixurl").onkeydown = async e => {
    if (e.key === "Enter" && e.target.value.trim()) {
      e.preventDefault();
      try { const r = await api("/api/fix_link", {id: it.id, url: e.target.value.trim()}); closeModal(); S.asked = null; toast(isPrivate() && !/^every /.test(r.scope) ? "Learned for this thread" : "Learned for " + r.scope); await loadRules(); await load(); }
      catch (err) { toast("Couldn't learn that: " + err.message); }
    }
    if (e.key === "Escape") closeModal();
  };
}
async function teach(label){
  const gs = targets(); if (!gs.length) return;
  clearPicks();
  const threads = new Set(gs.map(g => g.lead.thread));
  optimistic(() => { S.items = S.items.map(x => threads.has(x.thread) ? Object.assign({}, x, {label}) : x); },
             () => api("/api/label", {ids: gs.map(g => g.lead.id), label}));
  const who = gs.length > 1 ? gs.length + " senders" : (isPrivate() ? "this sender" : (gs[0].lead.sender || gs[0].lead.title || "this sender"));
  toast((label === "noise" ? "Not important: " : "Always important: ") + who);
}
function mute(){
  const gs = targets(); if (!gs.length) return;
  const names = [...new Set(gs.map(g => g.lead.app_name))].join(", ");
  modal(`<h3>Mute ${esc(names)}?</h3><p>pile will skip everything from ${esc(names)} from now on, and clear what's here. <kbd>z</kbd> undoes it.</p>
    <div class="opts"><button data-m="1"><span>Mute ${esc(names)}</span><kbd>y</kbd></button><button data-m="0"><span>Cancel</span><kbd>esc</kbd></button></div>`,
    k => { if (k === "y") { doMute(); return true; } });
  $("#popcard").onclick = e => { const b = e.target.closest("[data-m]"); if (b) b.dataset.m === "1" ? doMute() : closeModal(); };
  function doMute(){
    closeModal(); clearPicks();
    const apps = new Set(gs.map(g => g.lead.app));
    optimistic(() => dropItems(S.items.filter(x => apps.has(x.app)).map(x => x.id)), () => api("/api/mute", {ids: gs.map(g => g.lead.id)}));
    toast("Muted " + names);
  }
}

// c: combine the selected rows into one conversation (the newest row's). With nothing selected, start a selection.
async function combine(){
  const gs = targets();
  if (pickedSet().size < 2) {
    if (!pickedSet().size && gs[0]) { S.anchor = gs[0].lead.thread; render(); }
    toast("Shift+j / Shift+k to add rows, then c to combine");
    return;
  }
  clearPicks();
  const newest = gs.reduce((a, b) => (b.lead.at > a.lead.at ? b : a)).lead.thread;
  const merge = new Set(gs.map(g => g.lead.thread));
  optimistic(() => {
    S.items = S.items.map(x => merge.has(x.thread) ? Object.assign({}, x, {thread: newest}) : x);
    const i = groups().findIndex(g => g.lead.thread === newest); if (i >= 0) S.sel = i;
  }, () => api("/api/combine", {ids: gs.map(g => g.lead.id)}));
  toast("Combined " + gs.length + " rows. Learned for next time.");
}
async function ungroup(){
  const g = current(); if (!g) return;
  const r = await api("/api/ungroup", {id: g.lead.id});
  toast(r.forgot ? "Ungrouped" : "Nothing learned to undo here"); await loadRules(); await load();
}

// Undo is a persisted stack on the server: every u goes one step further back, even after a restart.
async function undoRedo(which){
  const r = await api("/api/" + which, {});
  const did = r[which === "undo" ? "undid" : "redid"];
  if (!did.length) { toast(which === "undo" ? "Nothing left to undo" : "Nothing to redo"); return; }
  let what = did[0];
  if (isPrivate()) what = what.split(" · ")[0];
  const left = which === "undo" ? r.remaining : r.redoable;
  toast((which === "undo" ? "Undid: " : "Redid: ") + what + (left ? ` (${left} more)` : ""));
  await loadRules(); await load();
}

function describe(r){
  const scope = r.sender ? esc(r.note.replace(/^learned from: /, "")) : (r.app ? "every item" : "everything");
  const app = r.app ? esc(r.app_name || r.app) : "any app";
  if (r.kind === "link") return `<div><b>${scope}</b> · ${app}</div><div class="v">→ ${esc(r.value)}</div>`;
  if (r.kind === "group") return `<div><b>${esc(r.note)}</b> are one conversation</div><div class="v">${app}</div>`;
  if (r.kind === "label") return `<div><b>${scope}</b> is <span class="chip ${esc(r.value)}">${esc(r.value)}</span></div><div class="v">${app}</div>`;
  return `<div><b>${esc(r.note || r.app)}</b> muted</div><div class="v">${app}</div>`;
}
async function drawer(show){
  const d = $("#drawer");
  if (!show) { d.classList.remove("show"); publish(); return; }
  await loadRules();
  d.innerHTML = `<h3>What I've learned</h3><p style="color:var(--dim);font-size:13px;margin:0 0 12px">From your corrections and your agents. Learned rules beat the built-in links and the model. <kbd>esc</kbd> closes.</p>` +
    (S.rules.length ? S.rules.map(r => `<div class="rule"><span class="k">${esc(r.kind)}</span><div>${describe(r)}</div><button data-del="${r.id}" title="Forget">×</button></div>`).join("")
      : `<p style="color:var(--faint)">Nothing yet. Press <kbd>f</kbd> on an item to fix where it opens, <kbd>+</kbd> or <kbd>-</kbd> to teach importance, <kbd>c</kbd> to combine selected rows into one conversation.</p>`);
  d.classList.add("show"); publish();
}
$("#drawer").addEventListener("click", async e => {
  const b = e.target.closest("[data-del]"); if (!b) return;
  await api("/api/rules/delete", {id: +b.dataset.del}); toast("Forgotten"); await drawer(true); await load();
});

document.addEventListener("click", e => {
  const v = e.target.closest("[data-view]"); if (v) { S.view = v.dataset.view; S.sel = 0; load(); return; }
  const s = e.target.closest("[data-src]"); if (s) { S.source = s.dataset.src; S.sel = 0; load(); return; }
  const a = e.target.closest("[data-act]"); if (a) { a.dataset.act === "yes" ? (S.asked = null, render(), toast("Good")) : fixLink(); return; }
  const b = e.target.closest("[data-a]");
  if (b) {
    S.sel = +b.closest(".row").dataset.i;
    ({open: openSel, done: () => act("done"), snooze: snoozeMenu, imp: () => teach("needs-you"), noise: () => teach("noise"),
      fix: fixLink, pick: () => { pick(S.sel); render(); }, combine, mute})[b.dataset.a]();
    return;
  }
  const r = e.target.closest(".row");
  if (r) {
    const i = +r.dataset.i;
    if (e.shiftKey) { if (S.anchor === null && groups()[S.sel]) S.anchor = groups()[S.sel].lead.thread; }
    else if (e.metaKey || e.ctrlKey) { pick(i); }
    else commitRange();
    S.sel = i; render();
  }
});
document.addEventListener("dblclick", e => { if (e.target.closest(".row")) openSel(); });
$("#learnedBtn").onclick = () => drawer(true);
$("#undoBtn").onclick = () => undoRedo("undo");
$("#refreshBtn").onclick = async () => { const r = await api("/api/collect", {}); toast("Collected " + (Object.entries(r).map(([k, v]) => k + " " + v).join(", ") || "nothing configured")); load(); };

const filter = $("#filter");
filter.addEventListener("input", () => { S.filter = filter.value; S.sel = 0; render(); });
filter.addEventListener("keydown", e => {
  if (e.key === "Escape") { filter.value = ""; S.filter = ""; filter.style.display = "none"; filter.blur(); render(); }
  if (e.key === "Enter" || e.key === "ArrowDown") { filter.blur(); }
});

document.addEventListener("keydown", e => {
  if (S.follow) {
    if (e.key === "Escape") { S.follow = false; $("#pop").classList.remove("show"); showToast("Stopped following; this tab is yours now"); }
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if ($("#pop").classList.contains("show")) {
    if (e.key === "Escape") { closeModal(); return; }
    // Option menus: arrows or j/k move the highlight, Enter picks it (the first option is highlighted to start).
    const opts = [...document.querySelectorAll("#popcard .opts button")];
    if (opts.length && e.target.tagName !== "INPUT") {
      const at = Math.max(0, opts.findIndex(b => b.classList.contains("hl")));
      const step = {ArrowDown: 1, j: 1, ArrowUp: -1, k: -1}[e.key];
      if (step) { opts[at].classList.remove("hl"); opts[(at + step + opts.length) % opts.length].classList.add("hl"); e.preventDefault(); publish(); return; }
      if (e.key === "Enter") { e.preventDefault(); opts[at].click(); return; }
    }
    if (modal.onkey && e.target.tagName !== "INPUT" && modal.onkey(e.key)) e.preventDefault();
    return;
  }
  if (e.target === filter) return;
  if ($("#drawer").classList.contains("show")) { if (e.key === "Escape" || e.key === "?") drawer(false); return; }
  const n = groups().length;
  if (S.asked !== null && (e.key === "y" || e.key === "n")) { e.preventDefault(); if (e.key === "y") { S.asked = null; render(); toast("Good"); } else fixLink(); return; }
  if (e.shiftKey && ["ArrowDown", "ArrowUp", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const step = {ArrowDown: 1, ArrowUp: -1, Home: -n, End: n}[e.key];
    extend(step, n); S.asked = null; paint(); return;
  }
  switch (e.key) {
    case "Home": case "End": e.preventDefault(); commitRange(); S.sel = e.key === "Home" ? 0 : n - 1; paint(); break;
    case "j": case "ArrowDown": e.preventDefault(); commitRange(); S.sel = Math.min(n - 1, S.sel + 1); S.asked = null; paint(); break;
    case "k": case "ArrowUp": e.preventDefault(); commitRange(); S.sel = Math.max(0, S.sel - 1); S.asked = null; paint(); break;
    case "J": extend(1, n); S.asked = null; paint(); break;
    case "K": extend(-1, n); S.asked = null; paint(); break;
    case "x": pick(S.sel); paint(); break;
    case " ": { e.preventDefault(); const g = current(); if (g) { S.expanded = S.expanded === g.lead.thread ? null : g.lead.thread; paint(); } break; }
    case "Escape": if (pickedSet().size) { clearPicks(); paint(); } break;
    case "o": openSel(); break;
    case "Enter": if (e.target.tagName !== "BUTTON") openSel(); break;
    case "e": act("done"); break;
    case "s": if (S.view !== "done") snoozeMenu(); break;
    case "/": e.preventDefault(); filter.style.display = "block"; filter.focus(); break;
    case "+": case "=": case "!": teach("needs-you"); break;
    case "-": teach("noise"); break;
    case "f": case "l": e.preventDefault(); fixLink(); break;
    case "m": mute(); break;
    case "c": case "g": combine(); break;
    case "C": case "G": ungroup(); break;
    case "?": drawer(true); break;
    case "r": $("#refreshBtn").click(); break;
    case "p": setPrivate(!isPrivate()); toast(isPrivate() ? "Screen-share mode: names and messages blurred" : "Screen-share mode off"); break;
    case "i": S.view = "new"; S.sel = 0; load(); break;
    case "u": case "z": undoRedo("undo"); break;
    case "U": case "Z": undoRedo("redo"); break;
    default:
      if (/^[0-9]$/.test(e.key) && S.view === "new") {
        const srcs = Object.keys(S.stats.sources || {});
        S.source = e.key === "0" ? "" : (srcs[+e.key - 1] || S.source); S.sel = 0; load();
      }
  }
});

// Screen-share mode: ?private (add &keep=github to leave public repo names readable), or press p. Per tab (sessionStorage), so one window can stay clear while another is shared.
function isPrivate(){ return document.body.classList.contains("private"); }
function setPrivate(on){
  document.body.classList.toggle("private", on);
  try { sessionStorage.setItem("pile.private", on ? "1" : ""); } catch (e) {}
}
(function(){
  const q = new URLSearchParams(location.search);
  let on = q.has("private");
  try { on = on || sessionStorage.getItem("pile.private") === "1"; } catch (e) {}
  setPrivate(on);
  if (q.get("keep") === "github") document.body.classList.add("keep-github");
})();
load(); loadRules();
if (S.follow) followLoop();
let lastKey = 0;
document.addEventListener("keydown", () => { lastKey = Date.now(); }, true);
setInterval(() => {
  if (!S.follow && !$("#pop").classList.contains("show") && document.visibilityState === "visible" && !S.pending && Date.now() - lastKey > 2000) load();
}, 15000);
</script>
</body>
</html>
